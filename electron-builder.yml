appId: com.omniscience.agent
productName: Omniscience
directories:
  output: dist
  buildResources: build

win:
  target:
    - target: nsis
      arch:
        - x64
  icon: build/icon.ico

nsis:
  oneClick: true
  perMachine: false
  allowToChangeInstallationDirectory: false
  createDesktopShortcut: true
  createStartMenuShortcut: true

files:
  - "**/*"
  - "!dist/*"
  - "native-addons/build/Release/*.node"
  - "!native-addons/build/Release/*.obj"
  - "!native-addons/build/Release/*.tlog"
  - "!native-addons/build/Release/*.pdb"
  - "!native-addons/build/*.vcxproj*"
  - "!native-addons/build/*.sln"

extraResources:
  - from: "build/tray-icon.ico"
    to: "build/tray-icon.ico"
  - from: "build/icon.ico"
    to: "build/icon.ico"

asarUnpack:
  - "**/*.node"
